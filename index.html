<!DOCTYPE html>
<html>
<head>

<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
}

.panel{
position:absolute;
top:10px;
right:10px;
z-index:999;

background:#111;
color:white;

padding:10px;
border-radius:12px;

width:150px;
}

button{
width:100%;
margin-top:6px;
padding:7px;
border:0;
border-radius:8px;
}

</style>

</head>


<body>


<div class="panel">

<b>🌦 Meteo</b>

<button onclick="toggleRain()">
🌧 Осадки
</button>

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const API_KEY = "b5fd8a2df3a6857059b351884cf1d26b";



const map = L.map('map')
.setView([55,60],4);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let rainLayer;



function toggleRain(){


if(rainLayer){

map.removeLayer(rainLayer);
rainLayer=null;

}

else{


rainLayer = L.tileLayer(

`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.6
}

);


rainLayer.addTo(map);


}

}





let marker;



map.on('click',function(e){


let lat=e.latlng.lat;
let lon=e.latlng.lng;



fetch(

`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=ru&appid=${API_KEY}`

)


.then(r=>r.json())

.then(data=>{


let popup=`

<b>📍 ${data.name}</b><br><br>

🌡 Температура:
${data.main.temp} °C

<br>

☁ ${data.weather[0].description}

<br>

💨 Ветер:
${data.wind.speed} м/с

<br>

⬇ Давление:
${data.main.pressure} гПа

`;



if(marker){
map.removeLayer(marker);
}


marker=L.marker([lat,lon])
.addTo(map)
.bindPopup(popup)
.openPopup();



});


});


</script>


</body>
</html>
