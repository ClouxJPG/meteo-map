<!DOCTYPE html>
<html>
<head>
<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
html, body {
    margin:0;
    height:100%;
}

#map {
    height:100%;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([55.75,37.61],5);


// карта

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap'
}
).addTo(map);


// получаем прогноз

fetch(
'https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&hourly=temperature_2m,precipitation,windspeed_10m,surface_pressure'
)

.then(r => r.json())

.then(data => {

let temp =
data.hourly.temperature_2m[0];

let rain =
data.hourly.precipitation[0];

let wind =
data.hourly.windspeed_10m[0];


L.popup()
.setLatLng([55.75,37.61])
.setContent(
`
Температура: ${temp}°C<br>
Осадки: ${rain} мм<br>
Ветер: ${wind} км/ч
`
)
.openOn(map);

});

</script>

</body>
</html>
