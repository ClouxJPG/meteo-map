<!DOCTYPE html>
<html>
<head>

<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html, body {
    margin:0;
    height:100%;
    font-family:Arial;
}

#map {
    height:100%;
}

.panel {
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:#111;
    color:white;
    padding:15px;
    border-radius:12px;
    width:260px;
}

button {
    margin-top:10px;
    padding:8px;
    width:100%;
}

</style>

</head>


<body>


<div class="panel">

<h3>🌦 Meteo Russia</h3>

<div id="info">
Нажми на карту
</div>

<button onclick="location.reload()">
Обновить
</button>

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const map = L.map('map')
.setView([55,60],4);


L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'OpenStreetMap'
}
).addTo(map);



let marker;



function getWeather(lat,lon){


fetch(
`https://api.open-meteo.com/v1/forecast?
latitude=${lat}
&longitude=${lon}
&hourly=
temperature_2m,
precipitation,
windspeed_10m,
surface_pressure
`
.replace(/\s/g,'')
)


.then(r=>r.json())


.then(data=>{


let t =
data.hourly.temperature_2m[0];

let rain =
data.hourly.precipitation[0];

let wind =
data.hourly.windspeed_10m[0];

let pressure =
data.hourly.surface_pressure[0];


document.getElementById("info").innerHTML =

`
<b>📍 Точка</b><br>
Широта: ${lat.toFixed(2)}<br>
Долгота: ${lon.toFixed(2)}
<hr>

🌡 Температура:
${t} °C

<br><br>

🌧 Осадки:
${rain} мм

<br><br>

💨 Ветер:
${wind} км/ч

<br><br>

⬇ Давление:
${pressure} гПа

`;



if(marker){
map.removeLayer(marker);
}


marker =
L.marker([lat,lon])
.addTo(map);


});


}



map.on(
'click',
function(e){


getWeather(
e.latlng.lat,
e.latlng.lng
);


}
);



</script>


</body>
</html>
