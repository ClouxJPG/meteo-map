<!DOCTYPE html>
<html>
<head>
<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
html, body {
    margin: 0;
    height: 100%;
}

#map {
    height: 100%;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([55, 60], 4);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution: 'OpenStreetMap'
}
).addTo(map);


// получение прогноза Open-Meteo

fetch(
'https://api.open-meteo.com/v1/forecast?latitude=55.75&longitude=37.61&hourly=temperature_2m,precipitation,windspeed_10m,surface_pressure'
)

.then(response => response.json())

.then(data => {

console.log(data);

});

</script>

</body>
</html>
