<!DOCTYPE html>
<html>
<head>

<title>Meteo Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
}


#menuBtn{
position:absolute;
top:10px;
right:10px;
z-index:1000;

background:#111;
color:white;

border:0;
border-radius:10px;

padding:10px;
font-size:18px;
}


.panel{
position:absolute;
top:55px;
right:10px;

z-index:999;

background:#111;
color:white;

padding:12px;

border-radius:12px;

width:170px;
}


.hidden{
display:none;
}


button{
width:100%;
margin-top:7px;

padding:8px;

border:0;
border-radius:8px;
}


.timeline{

position:absolute;
bottom:20px;

left:50%;

transform:translateX(-50%);

z-index:999;

background:#111;

color:white;

padding:12px;

border-radius:15px;

width:80%;
max-width:500px;

text-align:center;

}


input{
width:100%;
}

</style>

</head>


<body>


<button id="menuBtn">☰</button>


<div class="panel" id="panel">

<b>🌦 Meteo</b>

<button onclick="toggleRain()">
🌧 Осадки
</button>

<button onclick="toggleClouds()">
☁ Облака
</button>

<button onclick="toggleTemp()">
🌡 Температура
</button>

<button onclick="toggleWindLayer()">
💨 Ветер
</button>

</div>



<div class="timeline">

<div id="timeText">
Сейчас
</div>

<input 
id="timeSlider"
type="range"
min="0"
max="24"
step="3"
value="0">

</div>



<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const API_KEY="b5fd8a2df3a6857059b351884cf1d26b";


const map=L.map('map')
.setView([55,60],4);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let rainLayer;
let cloudLayer;
let tempLayer;
let windLayer;


let marker;

let currentLat;
let currentLon;

let forecastData;



let selectedHour=0;



document.getElementById("menuBtn").onclick=function(){

document.getElementById("panel")
.classList.toggle("hidden");

};




// загрузка прогноза


function loadForecast(){


if(currentLat==null)
return;



fetch(

`https://api.openweathermap.org/data/2.5/forecast?lat=${currentLat}&lon=${currentLon}&units=metric&lang=ru&appid=${API_KEY}`

)

.then(r=>r.json())

.then(data=>{


forecastData=data;


updatePopup();


});


}




// обновление окна


function updatePopup(){


if(!forecastData || !marker)
return;



let index=selectedHour/3;



let w=forecastData.list[index];



let date=new Date(w.dt*1000);



let popup=`

<b>📍 ${forecastData.city.name}</b>

<br><br>

🕒 ${date.toLocaleString("ru-RU")}

<br><br>

🌡 Температура:
${w.main.temp} °C

<br>

☁ ${w.weather[0].description}

<br>

🌧 Осадки:
${w.pop*100}%


<br>

💧 Влажность:
${w.main.humidity}%


<br>

💨 Ветер:
${w.wind.speed} м/с


<br>

⬇ Давление:
${w.main.pressure} гПа

`;



marker.setPopupContent(popup);




}





// ползунок


document.getElementById("timeSlider").oninput=function(){


selectedHour=Number(this.value);



document.getElementById("timeText").innerHTML=

selectedHour==0
?
"Сейчас"
:
"+"+selectedHour+" часов";



updatePopup();


};





// слои


function toggleRain(){

if(rainLayer){

map.removeLayer(rainLayer);

rainLayer=null;

}

else{

rainLayer=L.tileLayer(

`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{opacity:0.9}

).addTo(map);

}

}




function toggleClouds(){

if(cloudLayer){

map.removeLayer(cloudLayer);

cloudLayer=null;

}

else{

cloudLayer=L.tileLayer(

`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{opacity:0.8}

).addTo(map);

}

}




function toggleTemp(){

if(tempLayer){

map.removeLayer(tempLayer);

tempLayer=null;

}

else{

tempLayer=L.tileLayer(

`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{opacity:0.8}

).addTo(map);

}

}




function toggleWindLayer(){

if(windLayer){

map.removeLayer(windLayer);

windLayer=null;

}

else{

windLayer=L.tileLayer(

`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{opacity:0.8}

).addTo(map);

}

}





// клик по карте


map.on("click",function(e){


currentLat=e.latlng.lat;

currentLon=e.latlng.lng;



if(marker)
map.removeLayer(marker);



marker=L.marker([currentLat,currentLon])
.addTo(map);



loadForecast();



});



</script>


</body>
</html>
