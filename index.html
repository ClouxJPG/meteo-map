<!DOCTYPE html>
<html>
<head>

<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html, body {
    margin:0;
    height:100%;
    font-family:Arial;
}

#map {
    height:100%;
}


.panel {

    position:absolute;
    top:10px;
    right:10px;
    z-index:999;

    background:#111;
    color:white;

    padding:10px;

    border-radius:12px;

    width:140px;

    font-size:13px;

}


button {

    width:100%;

    margin-top:6px;

    padding:6px;

    border:0;

    border-radius:8px;

}


</style>

</head>


<body>


<div class="panel">

<b>🌦 Meteo</b>

<button>🌧 Осадки</button>

<button>⚡ Грозы</button>

<button>🌀 CAPE</button>

<button>💨 Ветер</button>


</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


constconst map = L.map('map').setView([55,60],4);
.



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let marker;



function getWeather(lat,lon){


fetch(

`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,windspeed_10m,surface_pressure`

)


.then(r=>r.json())


.then(data=>{


let temp =
data.hourly.temperature_2m[0];


let rain =
data.hourly.precipitation[0];


let wind =
data.hourly.windspeed_10m[0];


let pressure =
data.hourly.surface_pressure[0];



let popup = `

<b>📍 Прогноз</b><br><br>

🌡 ${temp} °C<br>

🌧 ${rain} мм<br>

💨 ${wind} км/ч<br>

⬇ ${pressure} гПа

`;



if(marker){

map.removeLayer(marker);

}



marker = L.marker([lat,lon])
.addTo(map)
.bindPopup(popup)
.openPopup();



});


}



map.on(
'click',
function(e){

getWeather(
e.latlng.lat,
e.latlng.lng
);

}

);



</script>


</body>
</html>
