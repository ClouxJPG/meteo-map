<!DOCTYPE html>
<html>
<head>

<title>Meteo Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
}


#menuBtn{
position:absolute;
top:10px;
right:10px;
z-index:1000;

background:#111;
color:white;

border:0;
border-radius:10px;

padding:10px;
font-size:18px;
}


.panel{
position:absolute;
top:55px;
right:10px;
z-index:999;

background:#111;
color:white;

padding:12px;
border-radius:12px;

width:180px;
}


.hidden{
display:none;
}


button{

width:100%;
margin-top:7px;

padding:8px;

border:0;
border-radius:8px;

}


.timeline{

position:absolute;
bottom:20px;

left:50%;
transform:translateX(-50%);

z-index:999;

background:#111;
color:white;

padding:12px;

border-radius:15px;

width:80%;
max-width:500px;

text-align:center;

}


input{
width:100%;
}


#windCanvas{

position:absolute;
top:0;
left:0;

z-index:500;

pointer-events:none;

}

</style>

</head>


<body>


<button id="menuBtn">☰</button>


<div class="panel" id="panel">

<b>🌦 Meteo</b>


<button onclick="toggleRain()">
🌧 Осадки
</button>


<button onclick="toggleClouds()">
☁ Облака
</button>


<button onclick="toggleTemp()">
🌡 Температура
</button>


<button onclick="toggleWindLayer()">
💨 Слой ветра
</button>


<button onclick="toggleParticles()">
🌬 Частицы ветра
</button>


</div>



<div class="timeline">

<div id="timeText">
Сейчас
</div>

<input 
type="range"
id="timeSlider"
min="0"
max="24"
step="3"
value="0">

</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const API_KEY="b5fd8a2df3a6857059b351884cf1d26b";


const map=L.map("map")
.setView([55,60],4);



L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png"
)
.addTo(map);



let rainLayer;
let cloudLayer;
let tempLayer;
let windLayer;


let marker=null;


let forecast=null;


let selectedHour=0;


document.getElementById("menuBtn")
.onclick=function(){

document.getElementById("panel")
.classList.toggle("hidden");

};





function updatePopup(){


if(!forecast || !marker)
return;



let item=forecast.list[selectedHour/3];


let date=new Date(item.dt*1000);



let text=`

<b>📍 ${forecast.city.name}</b>

<br><br>

🕒 ${date.toLocaleString("ru-RU")}

<br><br>

🌡 ${item.main.temp} °C

<br>

☁ ${item.weather[0].description}

<br>

🌧 Вероятность осадков:
${Math.round(item.pop*100)}%

<br>

💧 Влажность:
${item.main.humidity}%

<br>

💨 Ветер:
${item.wind.speed} м/с

<br>

⬇ Давление:
${item.main.pressure} гПа

`;



marker.setPopupContent(text);

}





document.getElementById("timeSlider")
.oninput=function(){


selectedHour=Number(this.value);


document.getElementById("timeText")
.innerHTML=

selectedHour==0
?
"Сейчас"
:
"+"+selectedHour+" часов";


updatePopup();


};





map.on("click",function(e){


let lat=e.latlng.lat;
let lon=e.latlng.lng;


fetch(

`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=ru&appid=${API_KEY}`

)

.then(r=>r.json())

.then(data=>{


forecast=data;


if(marker)
map.removeLayer(marker);



marker=L.marker([lat,lon])
.addTo(map);


marker.bindPopup("Загрузка...");


marker.openPopup();



updatePopup();



});

});
  // =======================
// СЛОИ OPENWEATHER
// =======================


function toggleRain(){

if(rainLayer){

map.removeLayer(rainLayer);
rainLayer=null;

}

else{

rainLayer=L.tileLayer(

`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.9
}

).addTo(map);

}

}




function toggleClouds(){

if(cloudLayer){

map.removeLayer(cloudLayer);
cloudLayer=null;

}

else{

cloudLayer=L.tileLayer(

`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);

}

}





function toggleTemp(){

if(tempLayer){

map.removeLayer(tempLayer);
tempLayer=null;

}

else{

tempLayer=L.tileLayer(

`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);

}

}




function toggleWindLayer(){

if(windLayer){

map.removeLayer(windLayer);
windLayer=null;

}

else{

windLayer=L.tileLayer(

`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);

}

}





// =======================
// ЧАСТИЦЫ ВЕТРА
// =======================


let windParticles=[];

let windActive=false;

let windCanvas;

let windCtx;

let windAnimation;



function toggleParticles(){


if(windActive){

windActive=false;


cancelAnimationFrame(windAnimation);


if(windCanvas){

windCanvas.remove();

windCanvas=null;

}


return;

}



windActive=true;


windCanvas=document.createElement("canvas");


windCanvas.id="windCanvas";


document.body.appendChild(windCanvas);



windCtx=windCanvas.getContext("2d");



resizeWind();



windParticles=[];



for(let i=0;i<350;i++){


windParticles.push({

x:Math.random()*window.innerWidth,

y:Math.random()*window.innerHeight,

speed:1+Math.random()*3,

length:5+Math.random()*15

});


}



animateWind();



}




function resizeWind(){

if(!windCanvas)
return;


windCanvas.width=window.innerWidth;

windCanvas.height=window.innerHeight;


}




window.addEventListener(
"resize",
resizeWind
);





function animateWind(){


if(!windActive)
return;



windCtx.clearRect(

0,
0,
windCanvas.width,
windCanvas.height

);



windCtx.strokeStyle="white";

windCtx.globalAlpha=0.45;



windParticles.forEach(p=>{


windCtx.beginPath();


windCtx.moveTo(
p.x,
p.y
);



p.x+=p.speed;



windCtx.lineTo(

p.x+p.length,

p.y

);



windCtx.stroke();



if(p.x>windCanvas.width+30){


p.x=-30;


p.y=Math.random()*windCanvas.height;


}



});



windAnimation=requestAnimationFrame(
animateWind
);


}
