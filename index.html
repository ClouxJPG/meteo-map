<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meteoforecast.ru</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
    overflow:hidden;
    transition:.25s;
}

body.light{
    background:#f4f4f4;
    color:#111;
}

#map{
    width:100vw;
    height:100vh;
}

.btn{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:18px;
    border:none;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(10px);
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:1000;
    transition:.2s;
}

body.light .btn{
    background:white;
    color:black;
}

.btn:hover{
    transform:scale(1.06);
}

#gps{
    top:18px;
    left:18px;
}

#settings{
    position:absolute;
    bottom:160px;
    left:18px;
}

#search{
    top:18px;
    right:18px;
}

#layers{
    right:18px;
    top:50%;
    transform:translateY(-50%);
}

#timeline{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:70%;
    max-width:650px;
    background:rgba(30,30,30,.88);
    padding:18px;
    border-radius:18px;
    z-index:1000;
    backdrop-filter:blur(12px);
}

body.light #timeline{
    background:white;
}

#timeline label{
    display:block;
    text-align:center;
    margin-bottom:10px;
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

.panel{
    position:fixed;
    top:0;
    right:0;
    width:300px;
    height:100vh;
    background:#00AC6B;
    transition:.3s ease;
    z-index:2000;
    padding:20px;
    overflow:hidden;
    transform:translateX(110%);
    visibility:hidden;
}

.panel.open{
    transform:translateX(0);
    visibility:visible;
}

body.light .panel{
    background:#ffffff;
}

 body{
    overflow:hidden;
    width:100vw;
    height:100vh;
}   

.panel h2{
    margin-bottom:20px;
}

.panel button{
    width:100%;
    margin-bottom:12px;
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:42px;
    height:42px;
    z-index:3000;
    pointer-events:none;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
}

#crosshair::before{
    width:2px;
    height:42px;
    left:20px;
    top:0;
}

#crosshair::after{
    width:42px;
    height:2px;
    left:0;
    top:20px;
}

#crosshair span{
    position:absolute;
    width:8px;
    height:8px;
    border:2px solid white;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.2);
}

#layerInfo{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(20,20,20,.9);
    color:white;
    padding:10px 18px;
    border-radius:15px;
    z-index:4000;
    font-weight:bold;
    backdrop-filter:blur(12px);
    min-width:250px;
    text-align:center;
}

body.light #layerInfo{
    background:white;
    color:black;
}    
</style>
</head>
<body>

<div id="map"></div>
<div id="crosshair">
    <span></span>
</div>

<div id="layerInfo">
    Загрузка...
</div>    

<button class="btn" id="gps">📍</button>

<button class="btn" id="settings">⚙️</button>

<button class="btn" id="search">🔍</button>

<button class="btn" id="layers">⬅️</button>

<div id="timeline">
<label>Время</label>
<input type="range" min="0" max="24" value="0">
</div>

<div class="panel" id="layerPanel">
<h2>Прогнозные слои</h2>

<button onclick="showLayer('precipitation')">Осадки</button>

<button onclick="alert('Грозовой слой пока отсутствует')">Грозы</button>

<button onclick="showLayer('temperature')">Температура</button>

<button onclick="showLayer('wind')">Ветер</button>

<button onclick="showLayer('clouds')">Облачность</button>

</div>

<div class="panel" id="settingsPanel">

<h2>settings</h2>

<button id="darkTheme"> Темная тема</button>

<button id="lightTheme"> Светлая тема</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([54.7388,55.9721],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);
const weatherLayers = {

    temperature: L.tileLayer(
        'https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=b5fd8a2df3a6857059b351884cf1d26b',
        {opacity:1.0}
    ),

    wind: L.tileLayer(
        'https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=b5fd8a2df3a6857059b351884cf1d26b',
        {opacity:0.6}
    ),

    clouds: L.tileLayer(
        'https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=b5fd8a2df3a6857059b351884cf1d26b',
        {opacity:0.6}
    ),

    pressure: L.tileLayer(
        'https://tile.openweathermap.org/map/pressure_new/{z}/{x}/{y}.png?appid=b5fd8a2df3a6857059b351884cf1d26b',
        {opacity:0.6}
    ),

    precipitation: L.tileLayer(
        'https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=b5fd8a2df3a6857059b351884cf1d26b',
        {opacity:0.6}
    )
};

let activeLayer = null;

function showLayer(name){

    if(activeLayer){
        map.removeLayer(activeLayer);
    }

    activeLayer = weatherLayers[name];

    if(activeLayer){
        activeLayer.addTo(map);
    }

}    

// Геолокация

document.getElementById("gps").onclick=()=>{

navigator.geolocation.getCurrentPosition(pos=>{

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

map.setView([lat,lon],12);

L.marker([lat,lon]).addTo(map);

});

};

// Панель слоев

;const layerPanel=document.getElementById("layerPanel");
const layerBtn=document.getElementById("layers");
const settingsPanel=document.getElementById("settingsPanel");
    
layerBtn.onclick=()=>{

    layerPanel.classList.toggle("open");

    if(layerPanel.classList.contains("open")){
        layerBtn.style.right="318px";
        layerBtn.innerHTML=">";
    }else{
        layerBtn.style.right="18px";
        layerBtn.innerHTML="<";
    }

    settingsPanel.classList.remove("open");

};

// Настройки

document.getElementById("settings").onclick = () => {

    settingsPanel.classList.toggle("open");

    layerPanel.classList.remove("open");

};

// Темы

document.getElementById("darkTheme").onclick=()=>{

document.body.classList.remove("light");

};

document.getElementById("lightTheme").onclick=()=>{

document.body.classList.add("light");

};

// Поиск (заглушка)

document.getElementById("search").onclick=()=>{

alert("поиск городов в разработке.");

};
async function updateInfo(){

    const c = map.getCenter();

    const url =
`https://api.openweathermap.org/data/2.5/weather?lat=${c.lat}&lon=${c.lng}&appid=b5fd8a2df3a6857059b351884cf1d26b&units=metric&lang=ru`;

    const res = await fetch(url);
    const data = await res.json();

    document.getElementById("layerInfo").innerHTML = `
🌡 ${data.main.temp.toFixed(1)}°C
💨 ${data.wind.speed} м/с
☁ ${data.clouds.all}%
`;
}

map.on("moveend", updateInfo);

updateInfo();    

map.on("click", async function(e){
...
});

    const lat = e.latlng.lat.toFixed(4);
    const lon = e.latlng.lng.toFixed(4);

    const url =
`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=b5fd8a2df3a6857059b351884cf1d26b&units=metric&lang=ru`;

    const res = await fetch(url);
    const data = await res.json();

    L.popup()
        .setLatLng(e.latlng)
        .setContent(`
<b>${data.name || "Неизвестное место"}</b><br>
🌡 ${data.main.temp} °C<br>
💧 ${data.main.humidity}%<br>
🌬 ${data.wind.speed} м/с<br>
☁ ${data.clouds.all}%<br>
🌡 Давление: ${data.main.pressure} гПа
`)
        .openOn(map);

});
    
</script>

</body>
</html>
