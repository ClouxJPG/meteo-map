<!DOCTYPE html>
<html>
<head>

<title>Meteo Russia</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
}


.panel{

position:absolute;
top:10px;
right:10px;
z-index:999;

background:#111;
color:white;

padding:10px;
border-radius:12px;

width:150px;

}


button{

width:100%;
margin-top:6px;
padding:7px;

border:0;
border-radius:8px;

}

</style>

</head>


<body>


<div class="panel">

<b>🌦 Meteo</b>

<button onclick="toggleRain()">
🌧 Осадки
</button>

<button>
⚡ Грозы
</button>

<button>
🌀 CAPE
</button>

<button>
💨 Ветер
</button>


</div>


<div id="map"></div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const map = L.map('map')
.setView([55,60],4);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
)
.addTo(map);



let rainLayer;



function toggleRain(){


if(rainLayer){

map.removeLayer(rainLayer);

rainLayer=null;

}

else{


rainLayer = L.tileLayer(

'https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=demo',

{
opacity:0.5
}

);


rainLayer.addTo(map);


}


}



let marker;



map.on('click',function(e){


let lat=e.latlng.lat;
let lon=e.latlng.lng;



fetch(

`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation,windspeed_10m,surface_pressure`

)


.then(r=>r.json())

.then(data=>{


let popup=`

<b>📍 Прогноз</b><br><br>

🌡 ${data.hourly.temperature_2m[0]} °C<br>

🌧 ${data.hourly.precipitation[0]} мм<br>

💨 ${data.hourly.windspeed_10m[0]} км/ч<br>

⬇ ${data.hourly.surface_pressure[0]} гПа

`;



if(marker){
map.removeLayer(marker);
}


marker=L.marker([lat,lon])
.addTo(map)
.bindPopup(popup)
.openPopup();


});


});


</script>


</body>
</html>
