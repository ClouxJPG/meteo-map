<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteoforecast.ru</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0b0b;
    color:white;
    overflow:hidden;
    transition:.25s;
}

body.light{
    background:#f4f4f4;
    color:#111;
}

#map{
    width:100vw;
    height:100vh;
}

.btn{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:18px;
    border:none;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(10px);
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:1000;
    transition:.2s;
}

body.light .btn{
    background:white;
    color:black;
}

.btn:hover{
    transform:scale(1.06);
}

#gps{
    top:18px;
    left:18px;
}

#settings{
    position:absolute;
    bottom:160px;
    left:18px;
}

#search{
    top:18px;
    right:18px;
}

#layers{
    right:18px;
    top:50%;
    transform:translateY(-50%);
}

#timeline{
    position:absolute;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:70%;
    max-width:650px;
    background:rgba(30,30,30,.88);
    padding:18px;
    border-radius:18px;
    z-index:1000;
    backdrop-filter:blur(12px);
}

body.light #timeline{
    background:white;
}

#timeline label{
    display:block;
    text-align:center;
    margin-bottom:10px;
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

.panel{
    position:absolute;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:#00AC6B;
    transition:.3s ease;
    z-index:2000;
    padding:20px;
    overflow:hidden;
}

body.light .panel{
    background:#ffffff;
}

.panel.open{
    right:0;
}

.panel h2{
    margin-bottom:20px;
}

.panel button{
    width:100%;
    margin-bottom:12px;
    padding:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="map"></div>

<button class="btn" id="gps">📍</button>

<button class="btn" id="settings">⚙️</button>

<button class="btn" id="search">🔍</button>

<button class="btn" id="layers">⬅️</button>

<div id="timeline">
<label>Время</label>
<input type="range" min="0" max="24" value="0">
</div>

<div class="panel" id="layerPanel">
<h2>Прогнозные слои</h2>

<button>Осадки</button>
<button>Грозы</button>
<button>Температура</button>
<button>Ветер</button>
<button>Облачность</button>

</div>

<div class="panel" id="settingsPanel">

<h2>settings</h2>

<button id="darkTheme"> Темная тема</button>

<button id="lightTheme"> Светлая тема</button>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([54.7388,55.9721],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

// Геолокация

document.getElementById("gps").onclick=()=>{

navigator.geolocation.getCurrentPosition(pos=>{

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

map.setView([lat,lon],12);

L.marker([lat,lon]).addTo(map);

});

};

// Панель слоев

;const layerPanel=document.getElementById("layerPanel");
const layerBtn=document.getElementById("layers");

layerBtn.onclick=()=>{

    layerPanel.classList.toggle("open");

    if(layerPanel.classList.contains("open")){
        layerBtn.style.right="318px";
        layerBtn.innerHTML=">";
    }else{
        layerBtn.style.right="18px";
        layerBtn.innerHTML="<";
    }

    settingsPanel.classList.remove("open");

};

// Настройки

const settingsPanel=document.getElementById("settingsPanel");

document.getElementById("settings").onclick = () => {

    settingsPanel.classList.toggle("open");

    layerPanel.classList.remove("open");

};

// Темы

document.getElementById("darkTheme").onclick=()=>{

document.body.classList.remove("light");

};

document.getElementById("lightTheme").onclick=()=>{

document.body.classList.add("light");

};

// Поиск (заглушка)

document.getElementById("search").onclick=()=>{

alert("поиск городов в разработке.");

};

</script>

</body>
</html>
