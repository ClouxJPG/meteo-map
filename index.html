<!DOCTYPE html>
<html>
<head>

<title>Meteo Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

html,body{
margin:0;
height:100%;
font-family:Arial;
}

#map{
height:100%;
}


/* кнопка меню */

#menuBtn{

position:absolute;
top:10px;
right:10px;

z-index:1000;

background:#111;
color:white;

border:0;
border-radius:10px;

padding:10px;

font-size:18px;

}


/* панель */

.panel{

position:absolute;

top:55px;
right:10px;

z-index:999;

background:#111;

color:white;

padding:12px;

border-radius:12px;

width:170px;

transition:.3s;

}


.hidden{

display:none;

}



button{

width:100%;

margin-top:7px;

padding:8px;

border:0;

border-radius:8px;

}




/* таймлайн */

.timeline{

position:absolute;

bottom:20px;

left:50%;

transform:translateX(-50%);

z-index:999;

background:#111;

color:white;

padding:12px;

border-radius:15px;

width:80%;

max-width:500px;

text-align:center;

}


input[type=range]{

width:100%;

}



</style>

</head>



<body>


<button id="menuBtn">
☰
</button>



<div class="panel" id="panel">


<b>🌦 Meteo</b>


<button onclick="toggleRain()">
🌧 Осадки
</button>


<button onclick="toggleClouds()">
☁ Облака
</button>


<button onclick="toggleTemp()">
🌡 Температура
</button>


<button onclick="toggleWind()">
💨 Ветер
</button>


</div>



<div class="timeline">


<div id="timeText">
Сейчас
</div>


<input 
type="range"
min="0"
max="24"
step="3"
value="0"
id="timeSlider"
>


</div>



<div id="map"></div>



<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script>


const API_KEY="b5fd8a2df3a6857059b351884cf1d26b";



const map=L.map('map')
.setView([55,60],4);



L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);



let rainLayer;
let cloudLayer;
let tempLayer;
let windLayer;



// меню

document
.getElementById("menuBtn")
.onclick=function(){

document
.getElementById("panel")
.classList.toggle("hidden");

};




// время


let selectedTime=0;


let slider=document.getElementById("timeSlider");


slider.oninput=function(){

selectedTime=this.value;


if(selectedTime==0){

document.getElementById("timeText").innerHTML=
"Сейчас";

}

else{

document.getElementById("timeText").innerHTML=
"+"+selectedTime+" часов";

}


};





function toggleRain(){

if(rainLayer){

map.removeLayer(rainLayer);
rainLayer=null;

}

else{

rainLayer=L.tileLayer(

`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.9
}

).addTo(map);

}

}




function toggleClouds(){

if(cloudLayer){

map.removeLayer(cloudLayer);
cloudLayer=null;

}

else{

cloudLayer=L.tileLayer(

`https://tile.openweathermap.org/map/clouds_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);

}

}





function toggleTemp(){

if(tempLayer){

map.removeLayer(tempLayer);
tempLayer=null;

}

else{

tempLayer=L.tileLayer(

`https://tile.openweathermap.org/map/temp_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);

}

}




function toggleWind(){

if(windLayer){

map.removeLayer(windLayer);
windLayer=null;

}

else{


windLayer=L.tileLayer(

`https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=${API_KEY}`,

{
opacity:0.8
}

).addTo(map);


}

}




// клик по карте


let marker;


map.on("click",function(e){


let lat=e.latlng.lat;
let lon=e.latlng.lng;



fetch(

`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=ru&appid=${API_KEY}`

)

.then(r=>r.json())

.then(data=>{


let id=Math.floor(selectedTime/3);


let weather=data.list[id];



let text=`

<b>📍 ${data.city.name}</b>

<br><br>

⏰ Прогноз: +${selectedTime}ч

<br><br>

🌡 ${weather.main.temp} °C

<br>

☁ ${weather.weather[0].description}

<br>

💧 ${weather.main.humidity}%

<br>

💨 ${weather.wind.speed} м/с

<br>

⬇ ${weather.main.pressure} гПа

`;



if(marker)
map.removeLayer(marker);



marker=L.marker([lat,lon])
.addTo(map)
.bindPopup(text)
.openPopup();



});


});



</script>


</body>
</html>
